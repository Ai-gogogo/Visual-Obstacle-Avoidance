<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>VisionAssist Camera</title>
  <link rel="stylesheet" href="ui.css">
  <script src="accessibility.js" defer></script>
  <script src="camera.js" defer></script>
</head>
<body class="phone">
  <main class="phone-pair" id="phone-pair">
    <div class="phone-card">
      <div class="wordmark"><span class="mark" aria-hidden="true">◉</span><span>VisionAssist Camera</span></div>
      <h1>Enter pairing code</h1>
      <p>Use the six-digit code shown on the computer.</p>
      <form id="phone-form" novalidate>
        <label for="code">Pairing code</label>
        <input id="code" type="text" inputmode="numeric" autocomplete="one-time-code" placeholder="000 000" maxlength="8" required aria-describedby="phone-status">
        <label for="camera-quality">Upload quality</label>
        <select id="camera-quality" aria-describedby="camera-quality-note">
          <option value="jpeg">Standard · JPEG, up to 640 px</option>
          <option value="png">Original pixels · lossless PNG</option>
        </select>
        <p id="camera-quality-note">For stereo, choose the same mode on both phones and calibrate at that size.</p>
        <button class="primary" id="connect">Connect camera</button>
      </form>
      <p id="phone-status" role="status"></p>
    </div>
  </main>
  <video class="phone-preview" id="local-camera" tabindex="-1" autoplay muted playsinline aria-label="Camera paired. Your camera preview is active." hidden></video>
  <p id="lens-status" role="status" hidden></p>
</body>
</html>
